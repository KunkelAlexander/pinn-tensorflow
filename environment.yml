name: pinn_env
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy
  - matplotlib
  - scipy
  - jupyter
  - jupyterlab
  - ipykernel
  # PyTorch — CPU build (default)
  # To use a GPU, remove the cpuonly line and replace with:
  #   pytorch-cuda=12.1   (adjust version to match your CUDA installation)
  - pytorch
  - cpuonly
